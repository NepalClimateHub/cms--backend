name: Build and Push Docker Image

on:
  push:
    branches: [main, develop]
    tags: ["*"]

env:
  IMAGE: ghcr.io/mukezhz/nch-cms-backend

jobs:
  build-and-push:
    name: build and push Docker image (ghcr)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: mukezhz
          password: ${{ secrets.GHCR_TOKEN }}

      # develop -> :develop, main -> :latest, git tag -> :<git tag>
      - name: Docker tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.prod
          platforms: linux/amd64,linux/arm64
          push: true
          no-cache: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Redeploy on Dokploy
        if: github.ref == 'refs/heads/main'
        run: |
          curl --fail-with-body -sS -X POST "${{ vars.DOKPLOY_URL }}/api/compose.deploy" \
            -H "x-api-key: ${{ secrets.DOKPLOY_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"composeId":"${{ vars.DOKPLOY_COMPOSE_ID }}"}'
